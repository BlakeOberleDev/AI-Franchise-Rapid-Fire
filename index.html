<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vanguard Champions: The Complete Chronicles</title><link rel="stylesheet" href="styles/launcher.css"></head>
<body><header class="topbar"><div class="brand">VANGUARD // CHRONICLES</div><div class="top-actions">
<button id="codexBtn">Lore Codex</button><button id="saveBtn">Save Manager</button><button id="settingsBtn">Settings</button></div></header>
<section class="hero"><canvas id="particles"></canvas><div class="hero-inner"><h1>VANGUARD CHAMPIONS</h1><p>THE COMPLETE CHRONICLES</p></div></section>
<main><div class="toolbar"><div class="filters"><button class="active" data-filter="chronology">Chronological</button><button data-filter="original">Original 7 + 6 Expansions</button></div><div class="completion">Franchise completion <strong id="completion">0%</strong></div></div><section id="gameGrid" class="grid"></section></main>
<script type="module">
import { loreData } from './shared/loreData.js';
import { loadSave, writeSave, exportSave, importSave, defaultSave } from './shared/saveManager.js';
import { modal } from './shared/uiComponents.js';
const games=[
['01-first-descent','The First Descent','Age of Primordials','Tactical Squad-Defense','#bc7049','#352543'],
['02-shattered-crown','Shattered Crown','Age of Ancients','Tactical Squad-Defense','#b88cff','#38234f'],
['03-crystal-sundering','The Crystal Sundering','Age of Ancients','Tactical Squad-Defense','#77d7d0','#2c4867'],
['04-eclipse-of-the-ancients','Eclipse of the Ancients','Age of Ancients','Tactical Squad-Defense','#edc96d','#3d2a67'],
['05-crimson-dawn','Crimson Dawn','Age of Kings','Tactical Squad-Defense','#d95a43','#452a2e'],
['06-eastern-reckoning','Eastern Reckoning','Age of Kings','Tactical Squad-Defense','#df994d','#57312c'],
['07-vanguard-champions','Vanguard Champions','Primordial Usurping','Tactical Squad-Defense','#7ba6ca','#263654'],
['08-wildlands','Wildlands','Primordial Usurping','Tactical Squad-Defense','#75a45a','#33492f'],
['09-depths-rising','Depths Rising','Primordial Usurping','Tactical Squad-Defense','#48b6bf','#213e62'],
['10-skyreach','Skyreach','Primordial Usurping','Tactical Squad-Defense','#87b8cf','#465478'],
['11-maelstrom','Maelstrom','Primordial Usurping','Tactical Squad-Defense','#a276e6','#263c75'],
['12-rebirth','Rebirth','Age of Rebirth','Action-Adventure RPG','#9bd6b1','#4d4377'],
['13-apocalypse','Apocalypse','The Apocalypse','Tactical Finale','#e2c66d','#6d3158']
];
let save=loadSave();
let filterMode='chronology';
const stageCount=i=>[7,8,10,13].includes(i+1)?6:5;
function render(){
 const grid=document.querySelector('#gameGrid');grid.innerHTML='';
 let indexes=games.map((_,i)=>i);
 if(filterMode==='original')indexes=[...indexes.slice(6),...indexes.slice(0,6)];
 let lastEra='';
 indexes.forEach(i=>{
  const g=games[i];
  if(filterMode==='chronology'&&g[2]!==lastEra){const heading=document.createElement('h2');heading.className='era-heading';heading.textContent=g[2];grid.appendChild(heading);lastEra=g[2];}
  if(filterMode==='original'&&i===6){const heading=document.createElement('h2');heading.className='era-heading';heading.textContent='The Original Seven';grid.appendChild(heading);}
  if(filterMode==='original'&&i===0){const heading=document.createElement('h2');heading.className='era-heading';heading.textContent='Six Lore Expansions';grid.appendChild(heading);}
  const gs=save.games[i+1]||{completedStages:[],endings:[]};const stages=stageCount(i);
  const pct=Math.round((gs.completedStages?.length||0)/stages*100);
  const card=document.createElement('article');card.className='card';card.style.setProperty('--c1',g[4]);card.style.setProperty('--c2',g[5]);
  const endingLabels={A:'Restoration',B:'The Eternal Cycle',C:'The Mentor’s Return',D:'The Unified Orb'};
  const endings=i===12?(gs.endings||[]).map(x=>{const code=x.charAt(0);return endingLabels[code]?`<span class="ending-badge" title="${endingLabels[code]}">Ending ${code}</span>`:''}).join(''):'';
  const next=gs.unlockedStages?.length?Math.min(stages,Math.max(...gs.unlockedStages)):1;
  const playLabel=(gs.completedStages?.length||0)>0?'CONTINUE':'PLAY';
  card.innerHTML=`<div class="cover"><canvas class="cover-art" aria-hidden="true"></canvas><span class="era">${g[2]}</span><b class="game-number">${String(i+1).padStart(2,'0')}</b></div><div class="card-body"><h2>${g[1]}</h2><div class="genre">${g[3]}</div><div class="progress"><i style="width:${pct}%"></i></div><div class="card-foot"><small>${gs.completedStages?.length||0}/${stages} stages${(gs.completedStages?.length||0)<stages?` · Next ${next}`:''}</small><a href="games/${g[0]}/index.html">${playLabel}</a></div>${endings?`<div class="ending-row" aria-label="Unlocked endings">${endings}</div>`:''}</div>`;
  grid.appendChild(card);
  paintCover(card.querySelector('.cover-art'),i,g[4],g[5]);
 });
 let completed=0,total=0;Object.values(save.games).forEach((g,i)=>{completed+=g.completedStages?.length||0;total+=stageCount(i)});
 document.querySelector('#completion').textContent=Math.round(completed/total*100)+'%';
}
function paintCover(canvas,index,primary,shadow){
 const ctx=canvas.getContext('2d');canvas.width=480;canvas.height=170;
 const gradient=ctx.createLinearGradient(0,0,480,170);gradient.addColorStop(0,primary);gradient.addColorStop(1,shadow);ctx.fillStyle=gradient;ctx.fillRect(0,0,480,170);
 const glow=ctx.createRadialGradient(330,48,3,330,48,110);glow.addColorStop(0,'#fff9');glow.addColorStop(1,'#fff0');ctx.fillStyle=glow;ctx.fillRect(220,0,230,150);
 let seed=(index+1)*7919;const rand=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};
 for(let i=0;i<38;i++){ctx.globalAlpha=.2+rand()*.45;ctx.fillStyle=i%4?'#fff':'#ffe38b';ctx.fillRect(rand()*480,rand()*115,1+rand()*2,1+rand()*2)}
 ctx.globalAlpha=.32;ctx.fillStyle='#061127';
 for(let i=0;i<7;i++){const x=i*82-20,h=35+rand()*60;ctx.beginPath();ctx.moveTo(x,145);ctx.lineTo(x+38,145-h);ctx.lineTo(x+82,145);ctx.fill()}
 ctx.globalAlpha=.62;ctx.fillStyle='#080e20';
 ctx.beginPath();ctx.moveTo(0,155);for(let x=0;x<=480;x+=24)ctx.lineTo(x,120+Math.sin((x+index*23)*.025)*22+Math.cos(x*.041+index)*12);ctx.lineTo(480,170);ctx.lineTo(0,170);ctx.fill();
 const px=180+(index%4)*34,py=107;
 ctx.globalAlpha=1;ctx.fillStyle=index%2?'#f4d18c':'#d7eaff';ctx.beginPath();ctx.arc(px,py-16,9,0,Math.PI*2);ctx.fill();ctx.fillRect(px-7,py-7,14,24);
 ctx.strokeStyle='#fff9';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(px+9,py-5);ctx.lineTo(px+22+(index%3)*4,py-22);ctx.stroke();
 ctx.fillStyle='#ffffff22';ctx.fillRect(0,159,480,11);ctx.globalAlpha=1;
}
render();
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{filterMode=b.dataset.filter;document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render();});
document.querySelector('#codexBtn').onclick=()=>modal('The Records of All Time', loreData.map(x=>`<details><summary><strong>${x.era}: ${x.title}</strong></summary><p>${x.text}</p></details>`).join());
document.querySelector('#saveBtn').onclick=()=>modal('Franchise Save Manager','<p>Export a portable, integrity-checked save or import a previously exported one.</p>',[
{label:'Export .json',primary:true,action:()=>exportSave(save)},
{label:'Import .json',action:()=>{const input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=async()=>{try{save=await importSave(input.files[0]);writeSave(save);render();modal('Save imported','Your franchise progress is restored.')}catch(e){modal('Import rejected',e.message)}};input.click()}},
{label:'Reset Save',action:()=>modal('Reset all progress?','This cannot be undone.',[{label:'Cancel'},{label:'Reset permanently',primary:true,action:()=>{save=defaultSave();writeSave(save);render();}}])}
]);
document.querySelector('#settingsBtn').onclick=()=>{
 const s=save.settings;modal('Audio & Accessibility',`<label>Master <input id="master" type="range" min="0" max="1" step=".05" value="${s.master}"></label><br><label>SFX <input id="sfx" type="range" min="0" max="1" step=".05" value="${s.sfx}"></label><br><label>Music <input id="music" type="range" min="0" max="1" step=".05" value="${s.music}"></label><br><label><input id="auto" type="checkbox" ${s.autoPause?'checked':''}> Tactical auto-pause</label><br><label><input id="contrast" type="checkbox" ${s.highContrast?'checked':''}> High-contrast telegraphs</label>`,[
 {label:'Save settings',primary:true,action:()=>{save.settings={master:+document.querySelector('#master').value,sfx:+document.querySelector('#sfx').value,music:+document.querySelector('#music').value,autoPause:document.querySelector('#auto').checked,highContrast:document.querySelector('#contrast').checked};writeSave(save);}}
 ]);
};
const c=document.querySelector('#particles'),p=c.getContext('2d');function particles(){const r=c.getBoundingClientRect();c.width=r.width;c.height=r.height;const a=Array.from({length:55},(_,i)=>({x:(i*173)%r.width,y:(i*97)%r.height,v:.12+(i%5)*.08,c:i%3?'#9b74ff':'#efc96d'}));function draw(t){p.clearRect(0,0,c.width,c.height);for(const q of a){q.y-=q.v;if(q.y<0)q.y=c.height;p.fillStyle=q.c;p.globalAlpha=.25+(Math.sin(t*.001+q.x)*.25);p.beginPath();p.arc(q.x,q.y,1.5,0,7);p.fill()}p.globalAlpha=1;requestAnimationFrame(draw)}requestAnimationFrame(draw)}particles();
</script></body></html>
